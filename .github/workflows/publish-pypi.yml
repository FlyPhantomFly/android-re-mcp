name: Publish to PyPI

# Publishes with PyPI "trusted publishing" (OIDC): no PyPI token is stored in GitHub.
# One-time setup (pypi.org -> Your account -> Publishing -> Add a new pending publisher):
#   PyPI project name : android-re-mcp
#   Owner             : FlyPhantomFly
#   Repository        : android-re-mcp
#   Workflow filename : publish-pypi.yml
#   Environment       : pypi
# These values must match this file exactly.

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Check release tag matches python/pyproject.toml
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(python3 -c "import tomllib; print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")"
          if [ "${RELEASE_TAG}" != "v${package_version}" ] && [ "${RELEASE_TAG}" != "${package_version}" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match python/pyproject.toml version '${package_version}'"
            exit 1
          fi

      - name: Build
        run: python -m pip install build twine && python -m build python && twine check python/dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish:
    name: PyPI publish
    needs: build
    runs-on: ubuntu-latest
    # The reviewer-approval wait happens before the job starts, so it does
    # not count against this limit; 20 covers the minutes the job runs.
    timeout-minutes: 20
    # Create this environment in GitHub (Settings -> Environments) and add yourself as a
    # required reviewer, so every publish needs a manual approval.
    environment: pypi
    permissions:
      id-token: write # lets the job request the OIDC token PyPI exchanges for a publish credential
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
