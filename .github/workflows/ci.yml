name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install
        run: python -m pip install -e "./python[dev]"

      - name: Lint
        run: ruff check python

      - name: Schema and docs checks
        run: |
          python scripts/check_schema_structure.py --repo .
          python scripts/check_docs_sync.py --repo .

      - name: Test
        run: pytest python/tests -q

  # The matrix job has no dexfile-cli.jar, so every ROUNDTRIP test skips
  # there. This job installs the pinned jar (SHA-256 verified against the
  # pin in setup/install_tool.py) and fails if any jar-gated test skips —
  # a broken download or a stale pin cannot pass silently.
  jar-gated:
    name: Jar-gated tests (dexfile-cli)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - uses: actions/setup-java@v7
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: python -m pip install -e "./python[dev]"

      - name: Install pinned dexfile-cli.jar
        run: |
          python - <<'EOF'
          import hashlib
          import urllib.request
          from pathlib import Path

          from android_re_mcp.setup.install_tool import _PINNED

          url, expected_sha = _PINNED["dexfile-cli.jar"]
          tools = Path.home() / "tools"
          tools.mkdir(parents=True, exist_ok=True)
          target = tools / "dexfile-cli.jar"
          urllib.request.urlretrieve(url, target)
          actual = hashlib.sha256(target.read_bytes()).hexdigest()
          if actual != expected_sha:
              raise SystemExit(f"jar sha256 mismatch: {actual} != {expected_sha}")
          print(f"installed {url} sha256={actual[:16]}…")
          EOF

      - name: Test (jar-gated tests must run, not skip)
        run: |
          set -o pipefail
          pytest python/tests -q -rs | tee pytest.out
          if grep -q "dexfile-cli.jar" pytest.out; then
            echo "::error::jar-gated tests skipped with the jar installed — check the pin or the skip condition"
            exit 1
          fi
